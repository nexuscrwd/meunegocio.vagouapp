<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Meu Negócio — Vagou</title>
    <meta name="description" content="Meu Negócio — Plataforma de Gestão e Vitrine Oficial Vagou" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <!-- PWA Primary Meta Tags -->
    <meta name="theme-color" content="#FFFFFF" id="meta-theme-color" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Vagou Pro" />
    <script>
      (function() {
        try {
          // Limpa chaves legadas que forçavam tema escuro ou barra grafite por engano
          localStorage.removeItem('vagou_user_theme_preference');
          localStorage.removeItem('vagou_theme');
          localStorage.removeItem('vagou_neutral_preset');

          // Por padrão o tom é SEMPRE claro ('light'); só ativa 'dark' se o usuário alternar manualmente (v3)
          var explicitThemeV3 = localStorage.getItem('vagou_theme_mode_v3');
          var effectiveTheme = explicitThemeV3 === 'dark' ? 'dark' : 'light';

          if (effectiveTheme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }

          var meta = document.getElementById('meta-theme-color');
          if (meta) {
            meta.setAttribute('content', effectiveTheme === 'dark' ? '#0F172A' : '#FFFFFF');
          }

          var host = window.location.hostname.toLowerCase();
          var parts = host.split('.');
          var reserved = { www: 1, app: 1, portal: 1, adm: 1, admin: 1, meunegocio: 1, api: 1, vagouapp: 1, dev: 1, staging: 1 };
          var isPreview = host === 'localhost' || host === '127.0.0.1' || host.indexOf('.run.app') !== -1 || host.indexOf('ais-') === 0;
          var urlParams = new URLSearchParams(window.location.search);
          var querySlug = (urlParams.get('salon') || urlParams.get('slug') || '').trim().toLowerCase();
          var hostSub = (!isPreview && parts.length >= 3 && !reserved[parts[0]]) ? parts[0] : '';
          var activeSlug = (querySlug && !reserved[querySlug]) ? querySlug : hostSub;

          if (activeSlug) {
            var s = JSON.parse(localStorage.getItem('vagou_salon_admin_settings') || '{}');
            var name = s.pwaName || s.salonName;
            var slogan = s.slogan || '';
            if (name) {
              document.title = slogan ? name + ' — ' + slogan : name;
              var metaTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
              if (metaTitle) metaTitle.setAttribute('content', name.slice(0, 12));
              var descEl = document.querySelector('meta[name="description"]');
              if (descEl) descEl.setAttribute('content', slogan || name);
              var ogT = document.querySelector('meta[property="og:title"]');
              if (ogT) ogT.setAttribute('content', name);
              var ogD = document.querySelector('meta[property="og:description"]');
              if (ogD) ogD.setAttribute('content', slogan || name);
            }
            var manifestEl = document.querySelector('link[rel="manifest"]');
            if (manifestEl) {
              manifestEl.setAttribute('href', '/manifest.json?salon=' + encodeURIComponent(activeSlug));
            }
            var pwa192 = '/api/pwa/icon?salon=' + encodeURIComponent(activeSlug) + '&size=192&purpose=any';
            var pwa512 = '/api/pwa/icon?salon=' + encodeURIComponent(activeSlug) + '&size=512&purpose=any';
            var appleTouchIcons = document.querySelectorAll('link[rel="apple-touch-icon"]');
            appleTouchIcons.forEach(function(el) { el.setAttribute('href', pwa192); });
            var favicons = document.querySelectorAll('link[rel="icon"]');
            favicons.forEach(function(el) {
              el.setAttribute('href', el.getAttribute('sizes') === '512x512' ? pwa512 : pwa192);
            });
          }
        } catch(e) {}
      })();
    </script>
    
    <!-- Google Fonts: Plus Jakarta Sans, Public Sans, IBM Plex Mono, Poppins, Cormorant Garamond, Oswald -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=IBM+Plex+Mono:wght@400;500;600;700&family=Oswald:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800;900&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Manifest & Icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="Vagou Pro — Gestão & Vagas Imediatas" />
    <meta property="og:description" content="Plataforma de gestão e vagas imediatas para profissionais e estabelecimentos de beleza e bem-estar." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512.png" />
  </head>
  <body class="bg-[#EEF2F6] dark:bg-slate-950 text-[#0F172A] dark:text-slate-100 antialiased selection:bg-slate-700 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const isPreviewOrDev =
            window.location.hostname.includes('run.app') ||
            window.location.hostname.includes('localhost') ||
            window.location.hostname.includes('127.0.0.1') ||
            window.location.port !== '';

          if (isPreviewOrDev) {
            navigator.serviceWorker.getRegistrations().then((registrations) => {
              for (const reg of registrations) {
                reg.unregister();
              }
            }).catch(() => {});
            if ('caches' in window) {
              caches.keys().then((keys) => {
                keys.forEach((k) => caches.delete(k));
              }).catch(() => {});
            }
            return;
          }

          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('SW registration error:', err);
          });
        });
      }
    </script>
  </body>
</html>
