<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Meu negocio - VAPP</title>
    <meta name="description" content="App ladocliente dos estabelecimento Vagou app" />
    
    <!-- PWA Primary Meta Tags -->
    <meta name="theme-color" content="#20C933" id="meta-theme-color" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vagou Pro" />
    <script>
      (function() {
        try {
          var savedColor = localStorage.getItem('vagou_accent_color');
          if (!savedColor) {
            try {
              var s = JSON.parse(localStorage.getItem('vagou_salon_admin_settings') || '{}');
              if (s && s.accentColor) savedColor = s.accentColor;
            } catch(e) {}
          }
          if (savedColor) {
            document.documentElement.style.setProperty('--accent-color', savedColor);
            document.documentElement.style.setProperty('--color-emerald-300', 'color-mix(in srgb, ' + savedColor + ' 70%, white 30%)');
            document.documentElement.style.setProperty('--color-emerald-400', 'color-mix(in srgb, ' + savedColor + ' 85%, white 15%)');
            document.documentElement.style.setProperty('--color-emerald-500', savedColor);
            document.documentElement.style.setProperty('--color-emerald-600', 'color-mix(in srgb, ' + savedColor + ' 85%, black 15%)');
            document.documentElement.style.setProperty('--color-emerald-700', 'color-mix(in srgb, ' + savedColor + ' 70%, black 30%)');
            var meta = document.getElementById('meta-theme-color');
            if (meta) meta.setAttribute('content', savedColor);
            var styleEl = document.createElement('style');
            styleEl.id = 'vagou-dynamic-accent';
            styleEl.textContent = `
              :root {
                --accent-color: ` + savedColor + ` !important;
                --color-emerald-300: color-mix(in srgb, ` + savedColor + ` 70%, white 30%) !important;
                --color-emerald-400: color-mix(in srgb, ` + savedColor + ` 85%, white 15%) !important;
                --color-emerald-500: ` + savedColor + ` !important;
                --color-emerald-600: color-mix(in srgb, ` + savedColor + ` 85%, black 15%) !important;
                --color-emerald-700: color-mix(in srgb, ` + savedColor + ` 70%, black 30%) !important;
                --color-emerald-50: color-mix(in srgb, ` + savedColor + ` 10%, white 90%) !important;
                --color-emerald-100: color-mix(in srgb, ` + savedColor + ` 18%, white 82%) !important;
                --color-emerald-200: color-mix(in srgb, ` + savedColor + ` 30%, white 70%) !important;
                --color-emerald-800: color-mix(in srgb, ` + savedColor + ` 55%, black 45%) !important;
                --color-emerald-900: color-mix(in srgb, ` + savedColor + ` 40%, black 60%) !important;
                --color-emerald-950: color-mix(in srgb, ` + savedColor + ` 20%, black 80%) !important;
              }
              .bg-accent {
                background-color: ` + savedColor + ` !important;
              }
              .text-accent {
                color: ` + savedColor + ` !important;
              }
              .border-accent {
                border-color: ` + savedColor + ` !important;
              }
              .text-white, .dark .text-white {
                color: #ffffff !important;
              }
            `;
            document.head.appendChild(styleEl);
          }

          var s = JSON.parse(localStorage.getItem('vagou_salon_admin_settings') || '{}');
          var icon = localStorage.getItem('vagou_salon_icon') || s.salonIcon || s.salonLogoDark;
          var name = s.pwaName || s.salonName;
          if (name) {
            document.title = name + ' — Vagou';
            var metaTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
            if (metaTitle) metaTitle.setAttribute('content', name.slice(0, 12));
          }
          if (icon) {
            var appleTouchIcons = document.querySelectorAll('link[rel="apple-touch-icon"]');
            appleTouchIcons.forEach(function(el) { el.setAttribute('href', icon); });
            var favicons = document.querySelectorAll('link[rel="icon"]');
            favicons.forEach(function(el) { el.setAttribute('href', icon); });
          }
        } catch(e) {}
      })();
    </script>
    
    <!-- Google Fonts: Poppins (Manual de Identidade Visual Vagou) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Manifest & Icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="Meu negocio - VAPP" />
    <meta property="og:description" content="App ladocliente dos estabelecimento Vagou app" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon.svg" />
  </head>
  <body class="bg-slate-950 text-slate-900 antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            // Força busca imediata por atualização do Service Worker no servidor
            reg.update();

            // Detecta quando um novo Service Worker está pronto
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                  }
                });
              }
            });
          }).catch((err) => {
            console.log('SW registration error:', err);
          });

          // Quando o novo Service Worker assumir o controle, recarrega para aplicar os estilos novos
          let refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });
        });
      }
    </script>
  </body>
</html>
